<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- App 100% atrás de autenticação: sem SEO, sem indexação. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Soft light/dark theme. User-selectable via data-theme (src/lib/theme.ts), applied
         in the bundle before render (no inline script, so the CSP stays restrictive);
         "system" follows prefers-color-scheme. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)" />
    <!--
      CSP restritiva (design.md, Riscos): mesmo com cookie HttpOnly, um XSS faria
      requisição autenticada — então não permitimos origem de script externa nem
      conexão fora do próprio origin. Ajustar via header do Worker em produção.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>Finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
